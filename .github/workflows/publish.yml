name: Publish Extension

# Publishes on a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`), or on demand
# from the Actions tab. Runs on Node 20 specifically because `ovsx` requires >=20 — this is the
# reason the workflow exists at all: it decouples publishing from whatever Node version happens
# to be installed locally.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: Which registry to publish to
        required: true
        default: both
        type: choice
        options:
          - both
          - marketplace
          - openvsx

jobs:
  publish:
    runs-on: ubuntu-latest

    # Hoisted to job level deliberately: the `secrets` context is NOT available inside step-level
    # `if:` conditions, but `env` is — so this is what lets each publish step below skip itself
    # when its token isn't configured, instead of failing the run.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and package
        run: npx vsce package --no-dependencies

      # Keeps the .vsix downloadable from the workflow run even if a publish step fails,
      # so a bad token never means rebuilding from scratch.
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' && (github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'marketplace') }}
        run: npx vsce publish --no-dependencies --packagePath *.vsix

      # The namespace must exist before the first publish, and creating it is a one-time
      # operation — but it errors if it already exists, so failure is tolerated here rather
      # than special-cased. Must match the `publisher` field in package.json.
      - name: Ensure Open VSX namespace exists
        if: ${{ env.OVSX_PAT != '' && (github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'openvsx') }}
        continue-on-error: true
        run: npx ovsx create-namespace sbllm-optimizer-dev

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' && (github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'openvsx') }}
        run: |
          ls -la *.vsix
          VSIX="$(ls *.vsix | head -n1)"
          echo "Publishing: $VSIX"
          set +e
          OUT="$(npx ovsx publish "$VSIX" -p "$OVSX_PAT" 2>&1)"
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            # Surfaced as an annotation, not just a log line: workflow logs need admin auth to
            # read, but annotations are public for a public repo — so the actual failure reason
            # is retrievable without handing anyone a GitHub token.
            echo "::error::ovsx exit $CODE :: $(echo "$OUT" | tr '\n' ' | ' | tail -c 900)"
          fi
          exit $CODE

      # Asserts the outcome against the registry rather than trusting the publish step's exit code.
      # Checks THIS version specifically: an earlier version of this step only looked for any
      # "version" field, which would pass on a stale listing even if the new version never landed.
      # Open VSX indexes asynchronously and has taken ~2 minutes in practice, hence the retries —
      # an immediate 404 or stale version means "not indexed yet", not "failed".
      - name: Verify it actually published
        if: ${{ env.OVSX_PAT != '' && (github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'openvsx') }}
        run: |
          set -euo pipefail
          WANT="$(node -p "require('./package.json').version")"
          echo "Expecting version $WANT on Open VSX"
          for i in $(seq 1 20); do
            GOT="$(curl -sf "https://open-vsx.org/api/sbllm-optimizer-dev/sbllm-optimizer" \
                   | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version || ''" 2>/dev/null || echo '')"
            if [ "$GOT" = "$WANT" ]; then
              echo "Confirmed: $WANT is live on Open VSX."
              exit 0
            fi
            echo "Registry reports '${GOT:-none}' (attempt $i/20), waiting for indexing..."
            sleep 15
          done
          echo "::error::Published $WANT but the registry never reported it (last saw '${GOT:-none}')."
          exit 1
